<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Иконка «Изгиба Питона»: змейка-изгиб и яблоко на тёмном поле в цветах темы «Неон». -->
  <defs>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1b6dff"/>
      <stop offset="1" stop-color="#3cffa4"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#162142"/>
      <stop offset="1" stop-color="#070b18"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g id="fg">
  <path d="M136 372 V244 a52 52 0 0 1 52 -52 H324 a52 52 0 0 0 52 -52 V132"
        fill="none" stroke="url(#body)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <rect x="340" y="98" width="72" height="72" rx="22" fill="#3cffa4" filter="url(#glow)"/>
  <circle cx="362" cy="124" r="9" fill="#070b18"/>
  <circle cx="390" cy="124" r="9" fill="#070b18"/>
  <circle cx="200" cy="380" r="30" fill="#ff3355" filter="url(#glow)"/>
  <path d="M200 350 q8 -18 22 -20" stroke="#4caf50" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
